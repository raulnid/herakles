name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # Latest patch of the minor in go.mod: go.mod holds the minimum, and builds
  # and govulncheck need the patched standard library.
  GO_VERSION: 1.26.x

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Builds both images, runs the example journey between two containers and
  # keeps the probe image under its size budget.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        run: |
          docker buildx build --load --target herakles -t herakles:ci .
          docker buildx build --load --target eurystheus -t eurystheus:ci .
      - name: Image size
        # Compressed size is what nodes pull; it does not depend on the local image store.
        run: |
          size=$(docker save herakles:ci | gzip -1 | wc -c)
          echo "herakles image: $((size / 1024)) KiB compressed"
          test "$size" -lt $((10 * 1024 * 1024))
      - name: Run the example journey once
        run: |
          docker network create ci
          docker run -d --name eurystheus --network ci -e EURYSTHEUS_API_KEY=demo-api-key eurystheus:ci
          docker run --rm --network ci --read-only \
            -v "$PWD/examples/kubernetes/herakles.yaml:/etc/herakles/config/herakles.yaml:ro" \
            -v "$PWD/examples/demo-api-key:/etc/herakles/secrets/api-key:ro" \
            herakles:ci run -once -config /etc/herakles/config/herakles.yaml

  # Tags with a hyphen (v0.3.0-rc.1) are pre-releases: they get their exact
  # version tag only, never {{major}}.{{minor}} or latest.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, govulncheck, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/herakles
          flavor: latest=${{ !contains(github.ref_name, '-') }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: herakles
          build-args: VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Sign
        # By digest: a tag can move, the digest is what was built here.
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/herakles@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

  # Static binaries and their checksums on the GitHub release of the tag.
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, govulncheck, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${p%/*} arch=${p#*/} ext=; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}" -o "dist/herakles$ext" ./cmd/herakles
            tar -czf "dist/herakles_${VERSION#v}_${os}_${arch}.tar.gz" -C dist "herakles$ext" -C .. LICENSE README.md
            rm "dist/herakles$ext"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        # The annotation of the tag (breaking changes, upgrade notes) goes
        # before the generated notes. checkout leaves tags lightweight, so fetch it again.
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(if:equals=tag)%(objecttype)%(then)%(contents)%(end)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --notes-file notes.md --prerelease="$PRERELEASE"
