name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  # Builds both images, runs the example journey between two containers and
  # keeps the probe image under its size budget.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build
        run: |
          docker buildx build --load --target herakles -t herakles:ci .
          docker buildx build --load --target eurystheus -t eurystheus:ci .
      - name: Image size
        # Compressed size is what nodes pull; it does not depend on the local image store.
        run: |
          size=$(docker save herakles:ci | gzip -1 | wc -c)
          echo "herakles image: $((size / 1024)) KiB compressed"
          test "$size" -lt $((10 * 1024 * 1024))
      - name: Run the example journey once
        run: |
          docker network create ci
          docker run -d --name eurystheus --network ci -e EURYSTHEUS_API_KEY=demo-api-key eurystheus:ci
          docker run --rm --network ci --read-only \
            -v "$PWD/examples/kubernetes/herakles.yaml:/etc/herakles/config/herakles.yaml:ro" \
            -v "$PWD/examples/demo-api-key:/etc/herakles/secrets/api-key:ro" \
            herakles:ci run -once -config /etc/herakles/config/herakles.yaml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/herakles
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: herakles
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
