# kubectl apply -k examples/kubernetes
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: herakles-demo
resources:
  - namespace.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - eurystheus.yaml
configMapGenerator:
  # The name gets a content hash, so editing herakles.yaml rolls the pod.
  - name: herakles-config
    files:
      - herakles.yaml
  # Picked up by the Grafana dashboard sidecar (kube-prometheus-stack), which
  # must watch this namespace or all of them. A stable name, so re-imports
  # update the dashboard instead of adding one.
  - name: herakles-dashboard
    files:
      - monitoring/dashboard.json
    options:
      labels: {grafana_dashboard: "1"}
      disableNameSuffixHash: true
images:
  - name: ghcr.io/raulnid/herakles
    newTag: 0.2.0
