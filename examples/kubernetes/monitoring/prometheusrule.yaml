# Example alerts. Tune the "for" windows to your interval: with 30s cycles,
# 5m is about 10 failed cycles in a row.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: herakles
  namespace: herakles-demo
  labels: {app.kubernetes.io/name: herakles}
spec:
  groups:
    - name: herakles
      rules:
        - alert: HeraklesLaborFailing
          expr: herakles_labor_success == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Labor {{ $labels.labor }} fails on {{ $labels.target }}"
            description: 'Failing step: check herakles_labor_failed_step{target="{{ $labels.target }}",labor="{{ $labels.labor }}"} == 1 and the herakles logs.'
        - alert: HeraklesLaborStale
          # Also fires when the probe is down or an earlier labor keeps this one skipped.
          expr: time() - herakles_labor_last_success_timestamp_seconds > 900
          labels: {severity: critical}
          annotations:
            summary: "Labor {{ $labels.labor }} on {{ $labels.target }} has not passed for 15 minutes"
        - alert: HeraklesCycleFailing
          # Catches what labor alerts cannot, such as an unreadable secret file.
          expr: herakles_cycle_success == 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Cycles on {{ $labels.target }} keep failing"
        - alert: HeraklesStepFailing
          # Optional steps included.
          expr: herakles_step_success == 0
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Step {{ $labels.labor }}/{{ $labels.step }} fails on {{ $labels.target }}"
        - alert: HeraklesStepSlow
          expr: quantile_over_time(0.95, herakles_step_last_duration_seconds[15m]) > 5
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "p95 of {{ $labels.labor }}/{{ $labels.step }} on {{ $labels.target }} is over 5s"
        - alert: HeraklesTransferSlow
          expr: max_over_time(herakles_transfer_bytes_per_second[15m]) < 1e6
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.direction }} on {{ $labels.target }} below 1 MB/s for 15 minutes"
        - alert: HeraklesCertNotRenewed
          # Less than a third of its lifetime left: the renewal, due at two
          # thirds (cert-manager's default), did not happen. Relative to the
          # lifetime, so one rule fits 24-hour and 90-day certificates alike.
          # The certificate is the first to expire in the chain the step saw.
          expr: |
            herakles_tls_cert_expiry_timestamp_seconds - time()
              < (herakles_tls_cert_expiry_timestamp_seconds - herakles_tls_cert_not_before_timestamp_seconds) / 3
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "A certificate served to {{ $labels.labor }}/{{ $labels.step }} on {{ $labels.target }} was not renewed: it expires in {{ $value | humanizeDuration }}"

    # SLO on the user journey: 99.9% of labor runs pass over 30 days.
    # Multiwindow burn rate (Google SRE workbook): 14.4x over 1h/5m pages for
    # 2% of the monthly budget, 6x over 6h/30m for 5%.
    - name: herakles-slo
      rules:
        - record: herakles:labor_error_ratio:rate5m
          expr: |
            sum by (target, labor) (rate(herakles_labor_runs_total{result="failed"}[5m]))
            /
            sum by (target, labor) (rate(herakles_labor_runs_total{result=~"ok|failed"}[5m]))
        - record: herakles:labor_error_ratio:rate30m
          expr: |
            sum by (target, labor) (rate(herakles_labor_runs_total{result="failed"}[30m]))
            /
            sum by (target, labor) (rate(herakles_labor_runs_total{result=~"ok|failed"}[30m]))
        - record: herakles:labor_error_ratio:rate1h
          expr: |
            sum by (target, labor) (rate(herakles_labor_runs_total{result="failed"}[1h]))
            /
            sum by (target, labor) (rate(herakles_labor_runs_total{result=~"ok|failed"}[1h]))
        - record: herakles:labor_error_ratio:rate6h
          expr: |
            sum by (target, labor) (rate(herakles_labor_runs_total{result="failed"}[6h]))
            /
            sum by (target, labor) (rate(herakles_labor_runs_total{result=~"ok|failed"}[6h]))
        - alert: HeraklesLaborErrorBudgetBurn
          expr: |
            (
              herakles:labor_error_ratio:rate1h > (14.4 * 0.001)
              and herakles:labor_error_ratio:rate5m > (14.4 * 0.001)
            ) or (
              herakles:labor_error_ratio:rate6h > (6 * 0.001)
              and herakles:labor_error_ratio:rate30m > (6 * 0.001)
            )
          labels: {severity: critical}
          annotations:
            summary: "Labor {{ $labels.labor }} on {{ $labels.target }} burns its 99.9% error budget too fast"
            description: 'Failing steps: topk(3, sum by (step) (increase(herakles_step_runs_total{target="{{ $labels.target }}",labor="{{ $labels.labor }}",result="failed"}[1h])))'
